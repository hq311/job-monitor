name: Job monitor

on:
  workflow_dispatch:
  schedule:
    # The cadence step below runs the monitor every other day at 02:00 UTC
    # (10:00 Singapore time), including across month boundaries.
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check every-other-day cadence
        id: cadence
        if: github.event_name == 'schedule'
        run: |
          day_number=$(( $(date -u +%s) / 86400 ))
          if (( day_number % 2 == 0 )); then
            echo "run_monitor=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_monitor=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and update jobs
        id: monitor
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || steps.cadence.outputs.run_monitor == 'true'
        run: python3 monitor.py

      - name: Commit updated tracker data and dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json dashboard.html output/details logs/run_history.jsonl
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            run_timestamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
            git commit -m "Update job tracker (${run_timestamp})" \
              -m "GitHub Actions workflow run #${GITHUB_RUN_NUMBER}"
            git push
          fi

      - name: Mark workflow failed when monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
