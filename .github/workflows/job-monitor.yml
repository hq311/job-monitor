name: Job monitor

on:
  workflow_dispatch:
  schedule:
    # Runs at 02:00 UTC every other calendar day (10:00 Singapore time).
    - cron: "0 2 */2 * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and update jobs
        id: monitor
        continue-on-error: true
        run: python3 monitor.py

      - name: Commit updated tracker data and dashboard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json dashboard.html output/details logs/run_history.jsonl logs/monitor.log
          if git diff --cached --quiet; then
            echo "No tracker changes to commit."
          else
            git commit -m "Update job tracker"
            git push
          fi

      - name: Mark workflow failed when monitor failed
        if: steps.monitor.outcome == 'failure'
        run: exit 1
